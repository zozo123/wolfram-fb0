# wolfram-fb0 sandbox — a real Linux VM with the asm/eBPF/qemu toolchain
# pre-warmed. See README for the "real VM, not a container" framing.
#
# What's baked into the sandbox image:
#   - apt: nasm, ld, qemu-system-x86, bpftrace, python3 + numpy/pillow, build-essential
#   - Homebrew (linuxbrew) for clean userland tool installs going forward
#   - ollama + smallest Gemma (downloaded on first setup, persists via snapshot)
#   - opencode (the inner-loop coding agent)

sandbox: wolfram-fb0

cpu: 4
memory_mb: 16384   # gemma4 needs ~9.8 GiB; system overhead eats another ~700 MiB. 16 GiB is safe.
disk_gb: 40        # 9.6 GiB model + apt + brew + qemu kernel build → headroom.

env:
  WOLFRAM_DIST: /workspace/wolfram-fb0/dist
  WOLFRAM_ITER: /workspace/wolfram-fb0/iterations
  WOLFRAM_MODEL: gemma4:e2b   # smallest gemma4 in ollama registry (7.2 GB on disk)
  WOLFRAM_FB_BRIDGE_PORT: "8910"
  WOLFRAM_BPF_BRIDGE_PORT: "8911"
  # Homebrew on Linux defaults to this prefix.
  HOMEBREW_PREFIX: /home/linuxbrew/.linuxbrew

setup_script: |
  set -e
  echo "=== wolfram-fb0 setup begin ==="
  export DEBIAN_FRONTEND=noninteractive

  # ── apt: build prereqs + the system toolchain we own end-to-end ────────
  sudo apt-get update
  sudo apt-get install -y --no-install-recommends \
      build-essential procps curl file git ca-certificates \
      nasm binutils \
      qemu-system-x86 qemu-utils \
      bpftrace \
      python3 python3-pip python3-numpy python3-pillow \
      cpio gzip xz-utils zstd

  # ── Homebrew (linuxbrew) — clean userland for any tools we add later ──
  if ! command -v brew >/dev/null 2>&1; then
    NONINTERACTIVE=1 /bin/bash -c \
      "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  fi
  if ! grep -q 'linuxbrew/.linuxbrew/bin/brew shellenv' ~/.bashrc 2>/dev/null; then
    echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"' >> ~/.bashrc
  fi
  eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" 2>/dev/null || true

  # ── Ollama: local model runtime (needs zstd, which we apt-installed) ──
  if ! command -v ollama >/dev/null 2>&1; then
    curl -fsSL https://ollama.com/install.sh | sudo sh
  fi
  (nohup ollama serve > /tmp/ollama.log 2>&1 &) ; sleep 3
  ollama pull "$WOLFRAM_MODEL" || true

  # ── Opencode: inner-loop coding agent ─────────────────────────────────
  if ! command -v opencode >/dev/null 2>&1; then
    curl -fsSL https://opencode.ai/install | bash || true
  fi

  echo "=== wolfram-fb0 setup complete ==="

# When this sandbox is provisioned, islo clones the repo into /workspace/wolfram-fb0.
sources:
  - url: github://zozo123/wolfram-fb0
